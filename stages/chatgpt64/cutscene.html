<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カットシーン | みんなのAI実践塾</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:#000; overflow:hidden;
    font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
  #stage{position:fixed; inset:0; overflow:hidden;}

  /* 背景（賢者イラスト・暗く沈める） */
  #bg{position:absolute; inset:0; background-size:cover; background-position:center;
    filter:brightness(.62) saturate(.95); transform:scale(1.08);
    transition:filter 1.6s, transform 12s linear;}
  #bg.pre{filter:brightness(.58) saturate(.88) !important;}         /* ふだん：少し暗い部屋（キャラを立たせる） */
  #bg.reveal{filter:brightness(1.14) saturate(1.1); transform:scale(1.0);}  /* 開いた瞬間：ぱっと明るく */
  /* 幕が開いた瞬間の光 */
  #burst{position:absolute; inset:0; z-index:7; pointer-events:none; opacity:0; background:#fff;}
  #burst.go{animation:bst 1.1s ease-out;}
  @keyframes bst{0%{opacity:0} 12%{opacity:.72} 100%{opacity:0}}
  /* 打ち明ける場面：背景だけ青く沈める（夜の絵を別に描かなくて済む） */
  #bg.dim{filter:brightness(.3) saturate(.55) hue-rotate(-10deg)!important;}
  #chara{transition:opacity .18s, transform .9s;}
  /* 立ち絵表示：_icon 以外の絵は、枠なしで大きく出す（サウンドノベルの見え方） */
  /* 立ち絵は下げて大きく。足もとはセリフ枠の裏に入れる（浮いて見えないように） */
  #chara.tachie{width:auto;bottom:14vh}
  /* 静かにする場面では粒を消す */
  #stage.quiet .snow{opacity:0;transition:opacity .7s}
  #chara.tachie img{width:auto;max-width:88vw;height:min(58vh,460px);object-fit:contain;
    object-position:bottom;border:none;border-radius:0;background:none;
    box-shadow:none;filter:drop-shadow(2px 5px 9px rgba(0,0,0,.5))}
  /* ===== スタンプ演出（達成の瞬間を大げさに祝う） ===== */
  #stamp{position:absolute; inset:0; z-index:10; display:none;
    align-items:center; justify-content:center; pointer-events:none;
    background:radial-gradient(circle at 50% 45%, rgba(0,0,0,.45) 0%, rgba(0,0,0,.62) 70%);}
  #stamp.on{display:flex;}
  #stamp .flash{position:absolute; inset:0; background:#fff; opacity:0; animation:stFlash .5s ease-out;}
  #stamp .ring{position:absolute; width:56vmin; height:56vmin; border-radius:50%;
    border:6px solid rgba(255,255,255,.9); opacity:0; animation:stRing .9s cubic-bezier(.2,.7,.3,1) .18s;}
  #stamp .ring.r2{border-color:var(--c,#4db6ac); animation-delay:.3s;}
  #stamp .mark{position:relative; width:54vmin; height:54vmin; max-width:340px; max-height:340px;
    border-radius:50%; display:grid; place-items:center; opacity:0;
    background:radial-gradient(circle at 40% 35%, #fffdf5, #ffe9b8 70%, #f6c86a);
    border:8px solid var(--c,#4db6ac); box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 30px rgba(255,255,255,.6);
    animation:stSlam .62s cubic-bezier(.18,1.3,.4,1) .12s forwards;}
  #stamp .mark img{width:74%; height:74%; border-radius:50%; object-fit:cover;}
  #stamp .mark .emo{font-size:16vmin;}
  #stamp .badge{position:absolute; bottom:-6%; left:50%; transform:translateX(-50%) rotate(-6deg);
    background:var(--c,#4db6ac); color:#06231c; font-weight:900; font-size:1.05rem; letter-spacing:.08em;
    border-radius:999px; padding:6px 20px; box-shadow:0 6px 16px rgba(0,0,0,.45); white-space:nowrap;}
  #stamp .cap{position:absolute; top:14%; left:50%; transform:translateX(-50%);
    color:#fff; font-weight:900; font-size:clamp(1rem,4.6vw,1.6rem); white-space:nowrap;
    text-shadow:0 3px 12px rgba(0,0,0,.9),0 0 26px rgba(255,220,120,.55); opacity:0;
    animation:stCap .5s ease-out .5s forwards;}
  #stamp .spark{position:absolute; left:50%; top:50%; font-size:5vmin; opacity:0;
    animation:stSpark .85s ease-out .22s forwards;}
  @keyframes stFlash{0%{opacity:.85} 100%{opacity:0}}
  @keyframes stRing{0%{opacity:.9; transform:scale(.25)} 100%{opacity:0; transform:scale(2.3)}}
  @keyframes stSlam{
    0%{opacity:0; transform:scale(3.6) rotate(-24deg)}
    45%{opacity:1}
    62%{transform:scale(.88) rotate(-4deg)}
    78%{transform:scale(1.08) rotate(-9deg)}
    100%{opacity:1; transform:scale(1) rotate(-7deg)}}
  @keyframes stCap{0%{opacity:0; transform:translateX(-50%) translateY(14px)} 100%{opacity:1; transform:translateX(-50%) translateY(0)}}
  @keyframes stSpark{0%{opacity:0; transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(.4)}
    30%{opacity:1}
    100%{opacity:0; transform:translate(-50%,-50%) rotate(var(--a)) translateX(38vmin) scale(1.1)}}
  #stage.shake{animation:shk .5s ease-out;}
  @keyframes shk{0%,100%{transform:translate(0,0)} 15%{transform:translate(-7px,4px)}
    30%{transform:translate(6px,-5px)} 45%{transform:translate(-5px,-3px)}
    60%{transform:translate(4px,3px)} 80%{transform:translate(-2px,1px)}}

  #vignette{position:absolute; inset:0; box-shadow:inset 0 0 200px rgba(0,0,0,.9);
    background:radial-gradient(circle at 50% 40%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);}

  /* 開放タイル（エンディング演出） */
  #tiles{position:absolute; inset:0; display:grid; grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(4,1fr); gap:2px; pointer-events:none;}
  #tiles .tl{background:rgba(14,10,22,.80); border:1px solid rgba(255,255,255,.05);
    transition:opacity 1s, transform 1s;}
  #tiles .tl.gone{opacity:0; transform:scale(.6) rotate(8deg);}

  /* 雪 */
  .snow{position:absolute; top:-10px; color:#fff; opacity:.85; pointer-events:none;
    animation:fall linear infinite; text-shadow:0 0 6px rgba(255,255,255,.6);}
  @keyframes fall{ to{ transform:translateY(110vh) translateX(30px) rotate(180deg);} }

  /* レターボックス（映画風） */
  .bar{position:absolute; left:0; right:0; height:9vh; background:#000; z-index:8;}
  .bar.top{top:0;} .bar.bottom{bottom:0;}

  /* タイトルカード */
  #title{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:9; text-align:center;
    opacity:0; transition:opacity 1s; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.42) 55%, rgba(0,0,0,0) 80%);}
  #title.show{opacity:1;}
  #title .main{color:#ffe08a; font-size:clamp(1.4rem,5vw,2.6rem); font-weight:900;
    text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 30px rgba(255,200,80,.35); letter-spacing:.04em;}
  #title .sub{color:#e9e2d2; font-size:clamp(.75rem,2.5vw,1rem); margin-top:12px; letter-spacing:.14em;}

  /* キャラクター */
  #chara{position:absolute; left:50%; bottom:20vh; transform:translate(-50%,40px);
    width:min(46vw,240px); opacity:0; transition:opacity .9s, transform .9s; z-index:6;}
  #chara.in{opacity:1; transform:translate(-50%,0);}
  #chara img, #chara .emoji{width:100%; aspect-ratio:1; object-fit:cover; object-position:top;
    border-radius:20px; border:3px solid #fff; box-shadow:0 10px 40px rgba(0,0,0,.6);}
  #chara .emoji{display:flex; align-items:center; justify-content:center; font-size:5rem; background:#2c3e46;}
  #chara.talk{animation:bob 1.1s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}

  /* セリフボックス */
  #dbox{position:absolute; left:50%; transform:translateX(-50%); bottom:11vh;
    width:min(92vw,720px); z-index:9; background:rgba(10,8,4,.86);
    border:2px solid var(--c,#4db6ac); border-radius:16px; padding:16px 20px 18px;
    color:#fff7ec; opacity:0; transition:opacity .4s;}
  #dbox.show{opacity:1;}
  #dbox .who{display:inline-block; font-weight:900; font-size:.8rem; color:#0b0f0e;
    background:var(--c,#4db6ac); border-radius:8px; padding:2px 12px; margin-bottom:8px;}
  #dbox .who.nar{background:transparent; color:#b9c2b0; font-style:italic; padding-left:0;}
  #dbox .who.reika{background:#f06292; color:#fff;}
  #dbox .tx{font-size:clamp(1rem,3.4vw,1.18rem); line-height:1.8; font-weight:600; min-height:2.6em;}
  #dbox .tx.nar{font-style:italic; color:#e7ecdf; font-weight:500;}
  #dbox .cue{position:absolute; right:16px; bottom:10px; color:var(--c,#4db6ac);
    animation:blink 1s infinite; font-size:.9rem;}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  /* 終了カード */
  #endcard{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:11; background:rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .8s;}
  #endcard.show{opacity:1; pointer-events:auto;}
  .btn{border:none; border-radius:12px; padding:13px 26px; font-size:1.05rem; font-weight:800;
    cursor:pointer; text-decoration:none; color:#fff; font-family:inherit;
    background:linear-gradient(135deg,var(--c,#4db6ac),#1b5e4f); box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .btn.ghost{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.35);}

  /* 操作 */
  #controls{position:absolute; top:calc(9vh + 10px); right:14px; z-index:12; display:flex; gap:8px;}
  #controls button{background:rgba(0,0,0,.5); color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:20px; padding:5px 14px; font-size:.8rem; cursor:pointer; font-family:inherit;}
  #tapHint{position:absolute; left:50%; bottom:3vh; transform:translateX(-50%); z-index:9;
    color:rgba(255,255,255,.5); font-size:.72rem; letter-spacing:.1em;}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="tiles"></div>
  <div id="stamp"></div>
  <div id="burst"></div>
  <div id="vignette"></div>
  <div class="bar top"></div>
  <div class="bar bottom"></div>

  <div id="title"><div class="main"></div><div class="sub"></div></div>
  <div id="chara"></div>

  <div id="dbox">
    <span class="who"></span>
    <div class="tx"></div>
    <span class="cue">▼</span>
  </div>

  <div id="endcard"></div>

  <div id="controls">
    <button id="skipBtn">スキップ ⏭</button>
    <button id="replayBtn" style="display:none">もう一度 ↺</button>
  </div>
  <div id="tapHint">タップで次へ</div>
</div>
<a href="../../index.html" title="トップ（ボードへ）" style="position:fixed;left:10px;top:10px;z-index:9998;background:rgba(255,255,255,.9);color:#9c6f08;font-weight:800;font-size:.8rem;text-decoration:none;border-radius:999px;padding:6px 14px;box-shadow:0 2px 8px rgba(0,0,0,.35);font-family:'Yu Gothic',sans-serif">🏠 トップ</a>

<script src="data/scenes.js?v=20260907"></script>
<script>
(function(){
  function $(s){ return document.querySelector(s); }
  function qp(k){ return new URLSearchParams(location.search).get(k); }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var AREA = (qp('area')||'A').toUpperCase();
  var SCENE = (qp('scene')||'op').toLowerCase();
  var data = (window.CUTSCENES||{})[AREA];
  if(!data){ document.body.innerHTML='<p style="color:#fff;padding:40px">シーンが見つかりません</p>'; return; }
  var beats = data[SCENE] || data.op;
  var CH = data.char;

  // 挑戦者名
  var name = '挑戦者';
  try{ var m=JSON.parse(localStorage.getItem('mcq_member')||'{}'); if(m.name) name=m.name; }catch(e){}
  var qn = qp('name'); if(qn) name=qn;

  document.documentElement.style.setProperty('--c', CH.color||'#4db6ac');

  // 背景・キャラ・雪
  /* 背景は scenes.js の bg があればそれ、無ければその部屋の絵（bg/A.jpg 等）を使う */
  var DEFAULT_BG = data.bg || ('bg/' + AREA + '.jpg');
  $('#bg').style.backgroundImage = "url('"+DEFAULT_BG+"')";
  var chara=$('#chara');
  chara.classList.toggle('tachie', String(CH.img||'').indexOf('_icon') < 0);
  chara.innerHTML = CH.img
    ? '<img src="'+CH.img+'" alt="'+esc(CH.name)+'" onerror="this.outerHTML=\'<div class=&quot;emoji&quot;>'+(CH.emoji||'✨')+'</div>\'">'
    : '<div class="emoji">'+(CH.emoji||'✨')+'</div>';
  (function snow(){
    var s=$('#stage');
    var pc=data.particle||'❄';
    for(var i=0;i<26;i++){
      var f=document.createElement('div'); f.className='snow';
      f.textContent=pc;
      f.style.left=(Math.random()*100)+'vw';
      f.style.fontSize=(7+Math.random()*9)+'px';
      f.style.animationDuration=(6+Math.random()*8)+'s';
      f.style.animationDelay=(-Math.random()*10)+'s';
      s.appendChild(f);
    }
  })();
  // タイル（ED reveal用）
  (function(){ var t=$('#tiles'); for(var i=0;i<24;i++){ var d=document.createElement('div'); d.className='tl'; t.appendChild(d);} })();
  // 幕（reveal）を使う場面かどうか。使わない場面（OPなど）は最初から明るく見せる
  var HAS_REVEAL = (function(){
    for(var i=0;i<beats.length;i++){ if(beats[i] && beats[i].t==='fx' && beats[i].fx==='reveal') return true; }
    return false;
  })();
  // 粒（雪のようなもの）は、幕が開くまで降らせない。ふだん降っていると意味が薄れるため。
  var PARTS_ON = !HAS_REVEAL;
  (function(){
    if(!HAS_REVEAL){
      document.querySelectorAll('#tiles .tl').forEach(function(el){ el.classList.add('gone'); });
      $('#bg').classList.add('reveal');
    } else {
      // 黒いブロックは使わない（せっかくの背景を隠さない）。
      // ふだんは少し暗くしておき、最後にぱっと明るくする演出だけ残す。
      document.querySelectorAll('#tiles .tl').forEach(function(el){ el.classList.add('gone'); });
      $('#bg').classList.add('pre');
      $('#stage').classList.add('quiet');     // 粒は最後まで止める
    }
  })();

  var dbox=$('#dbox'), who=dbox.querySelector('.who'), tx=dbox.querySelector('.tx'), cue=dbox.querySelector('.cue');
  var idx=-1, typing=null, typingText='', done=false;

  // オーディオ基盤ロード（BGM＋喋り音・エリアBGMはassets/bgm/{area}.mp3）
  (function(){ var t=document.createElement('script'); t.src='../../assets/bgm.js?v=10';
    t.onload=function(){ if(window.MCQBgm && AREA) MCQBgm.play(AREA, 'bgm/'); };
    document.head.appendChild(t); })();

  function typeLine(text, isNar, isReika, cb){
    text = text.replace(/\{name\}/g, name);
    tx.className = 'tx' + (isNar?' nar':'');
    tx.textContent=''; cue.style.display='none'; typingText=text;
    var i=0;
    if(typing) clearInterval(typing);
    chara.classList.toggle('talk', !isNar && !isReika);
    typing=setInterval(function(){
      i++; tx.textContent=text.slice(0,i);
      if(window.MCQBgm && i%2===0) MCQBgm.blip();   // ドラクエ風の喋り音
      if(i>=text.length){ clearInterval(typing); typing=null; cue.style.display='block'; chara.classList.remove('talk'); if(cb)cb(); }
    }, 34);
  }
  function finishTyping(){ if(typing){ clearInterval(typing); typing=null; tx.textContent=typingText; cue.style.display='block'; chara.classList.remove('talk'); return true;} return false; }

  function showTitle(b, after){
    var t=$('#title'); t.querySelector('.main').textContent=b.main||'';
    t.querySelector('.sub').textContent=b.sub||'';
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); setTimeout(after, 900); }, 2600);
  }
  function reveal(after){
    $('#bg').classList.remove('pre');
    $('#bg').classList.add('reveal');
    var bs = $('#burst'); if(bs){ bs.classList.remove('go'); void bs.offsetWidth; bs.classList.add('go'); }
    PARTS_ON = true;                          // ここから粒が降る（お祝い）
    $('#stage').classList.remove('quiet');
    var tl=document.querySelectorAll('#tiles .tl');
    // シャッフルして順に剥がす
    var order=Array.prototype.slice.call(tl).sort(function(){return Math.random()-.5;});
    order.forEach(function(el,i){ setTimeout(function(){ el.classList.add('gone'); }, i*90); });
    setTimeout(after, order.length*90 + 700);
  }
  function endCard(b){
    done=true;
    var e=$('#endcard');
    var h='<a class="btn" href="'+esc(b.href||'#')+'">'+esc(b.label||'つづける')+'</a>';
    if(b.href2) h+='<a class="btn ghost" href="'+esc(b.href2)+'">'+esc(b.label2||'もどる')+'</a>';
    e.innerHTML=h;
    e.classList.add('show');
    $('#tapHint').style.display='none';
    $('#replayBtn').style.display='inline-block';
    dbox.classList.remove('show');
  }

  /* ── ビートごとの絵の切り替え ──
     b.img  … 立ち絵の差し替え（例：chara/A_talk.webp＝打ち明ける顔）
     b.bg   … 背景の差し替え（例：bg/blackboard.png）
     b.dim  … true で背景を青く沈める（音を止める場面で使う）        */
  function setChara(src){
    chara.classList.toggle('tachie', src.indexOf('_icon') < 0);
    var el = chara.querySelector('img');
    if(!el){ chara.innerHTML = '<img src="'+esc(src)+'" alt="">'; return; }
    if(el.getAttribute('src') === src) return;
    chara.style.opacity = '0';
    setTimeout(function(){ el.src = src; chara.style.opacity = ''; }, 180);
  }
  function applyBeatArt(b){
    if(b.img) setChara(b.img);
    if(b.bg)  $('#bg').style.backgroundImage = "url('"+b.bg+"')";
    /* dim=背景の暗さ、quiet=降ってくる粒の有無。ふだんは連動、
       黒板のように「絵は見せたいが粒は消したい」場面だけ quiet を単独で指定する */
    if(typeof b.dim !== 'undefined'){
      $('#bg').classList.toggle('dim', !!b.dim);
      if(typeof b.quiet === 'undefined') $('#stage').classList.toggle('quiet', !!b.dim);
    }
    if(typeof b.quiet !== 'undefined') $('#stage').classList.toggle('quiet', !!b.quiet);
    if(!PARTS_ON) $('#stage').classList.add('quiet');   // 幕が開くまでは、どのコマでも粒を出さない
  }

  /* スタンプ演出。{t:'stamp', mark:'🐾', label:'1／8', cap:'スタンプ ゲット！'} */
  function playStamp(b, after){
    var box = $('#stamp');
    var icon = 'chara/' + AREA + '_icon.webp';
    var sparks = '';
    for(var i=0;i<12;i++){
      sparks += '<span class="spark" style="--a:' + (i*30) + 'deg; animation-delay:' + (0.2 + i*0.015) + 's">'
              + (b.mark || '✨') + '</span>';
    }
    box.innerHTML = '<div class="flash"></div>'
      + '<div class="ring"></div><div class="ring r2"></div>'
      + sparks
      + '<div class="mark"><img src="' + esc(icon) + '" alt="" '
      +   'onerror="this.outerHTML=\'<span class=&quot;emo&quot;>' + (b.mark || '🎖') + '</span>\'">'
      +   '<span class="badge">' + esc(b.label || '') + '</span></div>'
      + '<div class="cap">' + esc(b.cap || 'スタンプ ゲット！') + '</div>';
    box.classList.add('on');
    $('#stage').classList.add('shake');
    try{ if(window.MCQBgm && MCQBgm.blip){ MCQBgm.blip(); setTimeout(function(){ MCQBgm.blip(); }, 90); } }catch(e){}
    setTimeout(function(){ $('#stage').classList.remove('shake'); }, 600);
    setTimeout(function(){ box.classList.remove('on'); box.innerHTML=''; if(after) after(); }, 2100);
  }

  function next(){
    if(done) return;
    idx++;
    if(idx>=beats.length){ return; }
    var b=beats[idx];
    applyBeatArt(b);
    if(b.t==='title'){ dbox.classList.remove('show'); showTitle(b, next); }
    else if(b.t==='say'){
      dbox.classList.add('show');
      var isReika = (b.who === 'reika');
      who.className = 'who' + (isReika ? ' reika' : ''); who.style.display='inline-block';
      /* as=別のキャラが話す（例：チャッピー） ／ tag=同じキャラの中の呼び分け（例：兄・弟） */
      who.textContent = isReika ? '大塚麗夏'
                      : (b.as ? b.as
                      : (b.tag ? CH.name + '（' + b.tag + '）' : CH.name));
      typeLine(b.text, false, isReika);
    }
    else if(b.t==='nar'){
      dbox.classList.add('show');
      who.className='who nar'; who.textContent='';  who.style.display='none';
      typeLine(b.text, true);
    }
    else if(b.t==='fx' && b.fx==='reveal'){ dbox.classList.remove('show'); reveal(next); }
    else if(b.t==='stamp'){ dbox.classList.remove('show'); playStamp(b, next); }
    else if(b.t==='end'){ endCard(b); }
    else next();
  }

  // 進行：タップ or クリックで「タイプ完了 → 次へ」
  function advance(){
    if(done) return;
    var b=beats[idx];
    if(b && b.t==='stamp') return;             // スタンプ演出中はタップを受けない
    if(b && (b.t==='say'||b.t==='nar')){ if(finishTyping()) return; }
    next();
  }
  $('#stage').addEventListener('click', function(e){
    if(e.target.closest('#controls')||e.target.closest('#endcard')) return;
    advance();
  });

  $('#skipBtn').addEventListener('click', function(){
    // 最後の end beat まで飛ばす
    if(typing){ clearInterval(typing); typing=null; }
    var last=beats[beats.length-1];
    $('#bg').classList.remove('pre');
    $('#bg').classList.add('reveal');
    PARTS_ON = true; $('#stage').classList.remove('quiet');
    document.querySelectorAll('#tiles .tl').forEach(function(el){el.classList.add('gone');});
    idx=beats.length-1;
    if(last && last.t==='end') endCard(last);
    else { done=true; $('#endcard').innerHTML='<a class="btn" href="../../index.html">🗺️ ボードへ</a>'; $('#endcard').classList.add('show'); }
  });
  $('#replayBtn').addEventListener('click', function(){ location.reload(); });

  // キャラ登場 → 開始
  setTimeout(function(){ chara.classList.add('in'); }, 400);
  setTimeout(next, 700);
})();
</script>
</body>
</html>
