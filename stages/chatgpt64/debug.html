<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>見本市（デバッグ） | ChatGPT編</title>
<style>
  :root{--gr:#10a37f; --ink:#f2f0ea; --muted:#9aa3b5;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#14101c; color:var(--ink); line-height:1.7; padding:14px 12px 48px;
    font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:1.15rem; font-weight:900;}
  .warn{background:rgba(255,193,7,.12); border:1px solid rgba(255,193,7,.5); color:#ffe082;
    border-radius:10px; padding:8px 11px; font-size:.78rem; margin:8px 0 14px;}
  .card{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15);
    border-radius:14px; padding:13px; margin-bottom:14px;}
  .card h2{font-size:.95rem; color:var(--gr); margin-bottom:8px;}
  .state{font-size:.78rem; color:var(--muted); display:grid; gap:3px; margin-bottom:10px;}
  .state b{color:var(--ink);}
  .btns{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  @media(max-width:420px){ .btns{grid-template-columns:1fr;} }
  button{font-family:inherit; font-size:.85rem; font-weight:800; color:#06231c; cursor:pointer;
    background:linear-gradient(180deg,#13c194,#0b8064); border:none; border-radius:11px; padding:12px 10px;}
  button.ghost{background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.3);}
  button.warnbtn{background:rgba(255,90,90,.2); color:#ffcdd2; border:1px solid rgba(255,90,90,.5);}
  .links{display:grid; grid-template-columns:repeat(auto-fill,minmax(122px,1fr)); gap:8px;}
  a.lk{display:block; text-align:center; text-decoration:none; color:var(--ink); font-size:.8rem; font-weight:700;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); border-radius:11px; padding:11px 6px;}
  a.lk small{display:block; color:var(--muted); font-size:.68rem; font-weight:400;}
  a.lk:active{background:rgba(16,163,127,.25);}
  .msg{font-size:.78rem; color:#9be29b; min-height:1.4em; margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 見本市（ChatGPT編・関係者用）</h1>
  <div class="warn">このページは、このスマホ（ブラウザ）の中の表示だけを変えます。サーバーの記録・ランキング・他の人の画面は動きません。あとで「ぜんぶ元にもどす」を押せば消えます。</div>

  <div class="card">
    <h2>いまの状態</h2>
    <div class="state" id="state">読み込み中…</div>
    <div class="btns">
      <button id="bLogin">にせログインする</button>
      <button class="ghost" id="bLogout">ログアウト</button>
      <button id="bClear">64マス全部クリアずみに</button>
      <button class="ghost" id="bIntro">導入シーンを未読にもどす</button>
      <button id="bSound">音をオンにする</button>
      <button class="warnbtn" id="bReset">ぜんぶ元にもどす</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>入口</h2>
    <div class="links">
      <a class="lk" href="intro.html">導入シーン<small>はじめの12コマ</small></a>
      <a class="lk" href="index.html">ボード<small>64マスの盤面</small></a>
      <a class="lk" href="map.html?skipintro=1">マップ<small>8つの街</small></a>
      <a class="lk" href="memory.html?demo=1">記念写真<small>見本データ</small></a>
      <a class="lk" href="../../card.html">挑戦者カード<small>3つのパワー</small></a>
      <a class="lk" href="../../concierge.html">コンシェルジュ<small>相談窓口</small></a>
      <a class="lk" href="../../materials.html">教材ぜんぶ<small>関係者向け</small></a>
      <a class="lk" href="../../index.html">トップ<small>ワールド選び</small></a>
    </div>
  </div>

  <div class="card">
    <h2>街（8つの部屋）</h2>
    <div class="links" id="towns"></div>
  </div>

  <div class="card">
    <h2>クエスト（各部屋の1マス目）</h2>
    <div class="links" id="quests"></div>
  </div>

  <div class="card">
    <h2>お話（はじまり）</h2>
    <div class="links" id="ops"></div>
  </div>

  <div class="card">
    <h2>お話（おわり・あの夏の話）</h2>
    <div class="links" id="eds"></div>
  </div>
</div>

<script src="data/config.js"></script>
<script src="data/areas.js"></script>
<script src="data/characters.js"></script>
<script>
(function(){
  var CFG   = window.MCQ_CONFIG || {};
  var AREAS = window.MCQ_AREAS  || {};
  var CHARS = window.MCQ_CHARS  || {};
  var GID   = CFG.goalId || 'θ';
  var STAGE = 'chatgpt64';
  var LETTERS = 'ABCDEFGH'.split('');
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function jget(k,d){ try{ return JSON.parse(localStorage.getItem(k)||'null')||d; }catch(e){ return d; } }
  function jset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function say(t){ $('msg').textContent = t; }

  /* ---- リンクを並べる ---- */
  function label(a){ var c=CHARS[a]||{}, ar=AREAS[a]||{};
    return { chara:(c.name||a), room:(ar.town||ar.title||('エリア'+a)) }; }
  LETTERS.forEach(function(a,i){
    var L = label(a);
    $('towns').insertAdjacentHTML('beforeend',
      '<a class="lk" href="town.html?a='+a+'">'+esc(L.room)+'<small>'+esc(L.chara)+'</small></a>');
    $('quests').insertAdjacentHTML('beforeend',
      '<a class="lk" href="quest.html?id='+a+'1">'+a+'1<small>'+esc(L.chara)+'</small></a>');
    $('ops').insertAdjacentHTML('beforeend',
      '<a class="lk" href="cutscene.html?area='+a+'&scene=op&name=%E5%A1%BE%E9%95%B7">第'+(i+1)+'話 はじまり<small>'+esc(L.chara)+'</small></a>');
    $('eds').insertAdjacentHTML('beforeend',
      '<a class="lk" href="cutscene.html?area='+a+'&scene=ed&name=%E5%A1%BE%E9%95%B7">第'+(i+1)+'話 おわり<small>'+esc(L.chara)+'</small></a>');
  });

  /* ---- 状態表示 ---- */
  function refresh(){
    var token = '';
    try{ token = localStorage.getItem('mcq_member_token')||''; }catch(e){}
    var intro = false;
    try{ intro = !!localStorage.getItem('mcq_intro_'+STAGE); }catch(e){}
    var cleared = jget('mcq_cleared_'+GID, []).length;
    var loot    = jget('mcq_loot_'+GID, []).length;
    var audio   = jget('mcq_audio', {on:false});
    $('state').innerHTML =
        '<div>ログイン：<b>'+(token ? (token.indexOf('DEMO')===0 ? 'にせログイン中' : '本物のトークンあり') : 'なし')+'</b></div>'
      + '<div>導入シーン：<b>'+(intro ? '見たことになっている' : 'まだ見ていない（開くと再生される）')+'</b></div>'
      + '<div>クリアずみのマス：<b>'+cleared+' / 64</b>　まとめカード：<b>'+loot+' / 64</b></div>'
      + '<div>音：<b>'+(audio.on ? 'オン' : 'オフ')+'</b></div>';
    $('bSound').textContent = audio.on ? '音をオフにする' : '音をオンにする';
  }

  /* ---- ボタン ---- */
  $('bLogin').onclick = function(){
    try{ localStorage.setItem('mcq_member_token','DEMO-'+Date.now()); }catch(e){}
    say('にせログインしました。画面の見た目は変わりますが、報告や順位はサーバーに届きません。');
    refresh();
  };
  $('bLogout').onclick = function(){
    try{ localStorage.removeItem('mcq_member_token'); }catch(e){}
    say('ログアウトしました。'); refresh();
  };
  $('bClear').onclick = function(){
    var qs = [];
    LETTERS.forEach(function(a){ for(var n=1;n<=8;n++) qs.push(a+n); });
    jset('mcq_cleared_'+GID, qs);
    jset('mcq_loot_'+GID, qs);
    say('64マス全部をクリアずみにしました。盤面と記念写真の見た目が変わります。'); refresh();
  };
  $('bIntro').onclick = function(){
    try{ localStorage.removeItem('mcq_intro_'+STAGE); }catch(e){}
    say('つぎにマップを開くと、導入シーンがもう一度流れます。'); refresh();
  };
  $('bSound').onclick = function(){
    var a = jget('mcq_audio', {on:false, vol:0.3});
    a.on = !a.on; if(!a.vol) a.vol = 0.3; a.__a7 = true;
    jset('mcq_audio', a);
    say(a.on ? '音をオンにしました。お話の画面でBGMが鳴ります。' : '音をオフにしました。'); refresh();
  };
  $('bReset').onclick = function(){
    var del = [];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(/^mcq_/.test(k)) del.push(k);
      }
      del.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
    say(del.length + '件を消して、まっさらな状態にもどしました。'); refresh();
  };

  refresh();
})();
</script>
</body>
</html>
