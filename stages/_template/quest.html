<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>クエスト | みんなのAI実践塾</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<div id="app"></div>
<form id="gform" method="POST" target="_blank" style="display:none"></form>
<!-- ?id=A1 で表示するクエストを指定（64マス共通の1ファイル） -->
<script>window.PAGE={questId:(new URLSearchParams(location.search).get('id')||'A1').toUpperCase()};</script>
<script src="data/config.js?v=5"></script>
<script src="data/characters.js?v=9"></script>
<script src="data/urls.js?v=4"></script>
<script>
/* v19: 1マス表示に必要なエリア分だけ読む（初期ロード軽量化。全64マス分は読まない） */
(function(){
  var a=((window.PAGE&&window.PAGE.questId)||'A1').charAt(0);
  if('ABCDEFGH'.indexOf(a)<0)a='A';
  document.write('<script src="data/quests/'+a+'.js"><\/script>');
  document.write('<script src="data/missions/'+a+'.js"><\/script>');
})();
</script>
<script src="../../assets/engine.js?v=25"></script>
</body>
</html>
