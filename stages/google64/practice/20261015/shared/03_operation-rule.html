<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設備更新案件 記録運用ルール</title><link rel="stylesheet" href="../practice-reader.css"></head><body><main class="page"><header class="hero"><h1>設備更新案件 記録運用ルール</h1><p>練習用</p></header><section class="body"><ol><li>会議後、議事録担当が同日中に記録を追加する。</li><li>ファイル名は「日付_相手_内容」とする。</li><li>金額・期限・担当は原文または担当者へ確認する。</li><li>記録にない内容は「要確認」とし、推測で埋めない。</li><li>閲覧はプロジェクト担当者、編集は議事録担当者に限定する。</li><li>週1回、未決事項と期限超過を確認する。</li></ol><div class="note">架空データです。実在の会社・人物とは関係ありません。</div></section></main></body></html>
