<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A3 実践手順</title><style>body{font-family:"Yu Gothic",sans-serif;line-height:1.8;margin:0;background:#f5f7fb;color:#172033}main{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:22px;margin:14px 0}.warn{background:#fff4df;border:1px solid #e6ad43;padding:12px;border-radius:10px}</style></head><body><main><h1>A3 実践手順</h1><div class="warn">実在顧客名や機密資料を使わず、練習用フォルダで行います。</div><section class="card"><ol><li>練習用フォルダを1つ作る。</li><li>01_進行中、02_定常業務、08_アーカイブなど3つの大分類を作る。</li><li>大分類の下に案件、その下に資料を置き、3階層以内に収める。</li><li>番号順とアーカイブの位置を確認する。</li><li>構造が分かる画面を証跡にする。</li></ol></section></main></body></html>
