<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G2 質問テンプレート</title><link rel="stylesheet" href="../practice-reader.css"></head><body><main class="page"><header class="hero"><h1>G2 質問テンプレート</h1><p>資料に基づく回答と、不足情報を分ける</p></header><section class="body"><div class="card">以下の質問は、選択したソースだけを根拠に答えてください。資料にない内容は推測せず「資料に記載なし」と書いてください。回答ごとに根拠となるソースを示してください。</div><ol><li>A案とB案の初期費用、納期、保守条件を表で比較してください。</li><li>次回会議までの行動項目を、担当・期限・確認内容の3列で整理してください。</li><li>A案の保証期間は何年ですか。</li></ol></section></main></body></html>
