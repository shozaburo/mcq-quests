<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A8 操作練習</title><style>body{font-family:"Yu Gothic",sans-serif;line-height:1.85;margin:0;background:#f5f7fb;color:#172033}main{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 22px #18253b18;margin:14px 0}h1{font-size:1.55rem}h2{font-size:1.05rem;color:#275f9e}.warn{background:#fff4df;border:1px solid #e6ad43;padding:12px;border-radius:10px}li{margin:.4em 0}</style></head><body><main><h1>A8 操作練習</h1><div class="warn">実在顧客・個人情報・機密情報を使いません。Gmailは自分宛ての下書きにし、送信しません。</div><section class="card"><h2>手順</h2><ol><li>非機密の10MB以上の練習ファイルをGoogle Driveへアップロードします。</li><li>共有設定を開き、「制限付き」になっていることを確認します。</li><li>Gmailで自分宛てのメール下書きを作ります。</li><li>Driveアイコンから練習ファイルを選び、リンク形式で挿入します。</li><li>権限警告が出た場合は内容を読みます。公開範囲をむやみに広げません。</li><li>送信せず下書き保存し、Drive共有設定とGmail下書きが分かる画面を撮ります。</li></ol></section></main></body></html>
