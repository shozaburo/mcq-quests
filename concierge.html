<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コンシェルジュ | マンダラチャートクエスト</title>
<style>
/* ============================================================
   🧭 学びのコンシェルジュ
   全5コース320マスの索引(catalog.json)を持ち、
   「どこで何を学べるか」に答える。
   まず手元で検索してから、必要ならAI(Gemini経由)に整理させる二段構え。
   AIが使えない時も検索結果だけは必ず返す。
   ============================================================ */
:root{--gold:#f5c542;--ink:#f2f0ea;--dim:#b0a99c;--card:#1c1630;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#14101c,#1d1530 45%,#241a33);color:var(--ink);
  font-family:"Yu Gothic","Hiragino Sans",sans-serif;line-height:1.75;min-height:100dvh}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 40px}
header{text-align:center;padding:10px 0 6px}
header .badge{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;
  padding:3px 16px;font-size:.72rem;font-weight:900;letter-spacing:.12em}
header h1{font-size:1.35rem;font-weight:900;margin-top:9px}
header p{color:var(--dim);font-size:.82rem;margin-top:4px}
/* 質問例 */
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0 6px}
.chips button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.24);color:#e6dfd2;
  border-radius:999px;padding:6px 13px;font-size:.76rem;font-weight:700;cursor:pointer;font-family:inherit}
.chips button:hover{border-color:var(--gold);color:var(--gold)}
/* 会話 */
#log{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;
  background:rgba(245,197,66,.16);border:1px solid rgba(245,197,66,.5)}
.msg.me{flex-direction:row-reverse}
.msg.me .ico{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.bub{background:var(--card);border:1px solid rgba(255,255,255,.16);border-radius:14px;
  padding:11px 14px;font-size:.88rem;max-width:82%;white-space:pre-wrap;word-break:break-word}
.msg.me .bub{background:rgba(245,197,66,.14);border-color:rgba(245,197,66,.4)}
.hits{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.hit{display:block;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.16);border-radius:11px;
  padding:9px 11px;text-decoration:none;color:var(--ink)}
.hit:hover{border-color:var(--gold)}
.hit .h1{font-size:.84rem;font-weight:800}
.hit .h2{font-size:.7rem;color:var(--dim);margin-top:2px}
.hit .h3{font-size:.74rem;color:#cfc7b8;margin-top:4px;line-height:1.6}
.hit .mats{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.hit .mats span{font-size:.64rem;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:1px 8px;color:#ddd5c8}
.hit .mats span.no{opacity:.3}
/* 入力 */
.ask{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(36,26,51,0),rgba(36,26,51,.96) 22%);
  padding:14px 0 8px;margin-top:18px}
.askbox{display:flex;gap:8px}
.askbox input{flex:1;min-width:0;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.28);
  border-radius:999px;padding:11px 16px;color:var(--ink);font-size:.9rem;font-family:inherit}
.askbox input:focus{outline:none;border-color:var(--gold)}
.askbox button{flex:none;background:linear-gradient(180deg,#ffe082,#d9a92e);color:#2a1d00;border:none;
  border-radius:999px;padding:0 20px;font-weight:900;font-size:.9rem;cursor:pointer;font-family:inherit}
.askbox button:disabled{opacity:.5;cursor:not-allowed}
.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.foot a{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.24);color:#ddd;
  border-radius:999px;padding:8px 16px;font-size:.78rem;font-weight:700;text-decoration:none}
.foot a:hover{border-color:var(--gold);color:var(--gold)}
.note{font-size:.7rem;color:var(--dim);text-align:center;margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">CONCIERGE</span>
    <h1>🧭 学びのコンシェルジュ</h1>
    <p>全5コース・320マスから、あなたに合うところを探します。</p>
  </header>

  <div class="chips" id="chips"></div>
  <div id="log"></div>

  <div class="ask">
    <div class="askbox">
      <input id="q" type="text" placeholder="例：議事録を自動で作りたい" autocomplete="off">
      <button id="send">きく</button>
    </div>
    <div class="note" id="note">読み込み中…</div>
  </div>

  <div class="foot">
    <a href="index.html?start=1">🏠 トップへ</a>
    <a href="stages/google64/map.html?skipintro=1">🔍 Gemini編</a>
    <a href="stages/claude64/map.html?skipintro=1">🤖 Claude編</a>
    <a href="stages/chatgpt64/map.html?skipintro=1">🐕 ChatGPT編</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbzIpwPd49mlcRpuPa43fdg9P4n8mN2wEXFy2IcbrM87r5E90VjTHg1nhzVHn2b2Wxro/exec';
  var CAT = null;
  var busy = false;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function el(id){ return document.getElementById(id); }

  var EXAMPLES = [
    'AIをはじめて触ります。どこから？',
    '議事録を自動で作りたい',
    'Excelの集計をラクにしたい',
    '資料づくりが遅くて困っている',
    'スマホだけでできることは？',
    'いちばん短時間で成果が出るのは？'
  ];

  /* ── 手元検索。AIが落ちても必ずここは返す ── */
  function tokenize(q){
    return String(q||'').toLowerCase()
      .replace(/[、。！？!?,.]/g,' ')
      .split(/\s+/).filter(function(w){ return w.length >= 2; });
  }
  function search(q, limit){
    if(!CAT) return [];
    var ws = tokenize(q);
    var out = [];
    CAT.stages.forEach(function(st){
      st.areas.forEach(function(ar){
        ar.masses.forEach(function(m){
          var hay = (m.name + ' ' + m.doing + ' ' + ar.title + ' ' + ar.sub + ' ' + st.short).toLowerCase();
          var sc = 0;
          ws.forEach(function(w){
            if(m.name.toLowerCase().indexOf(w) >= 0) sc += 5;
            else if(hay.indexOf(w) >= 0) sc += 2;
          });
          // 素材が揃っているマスを少し優先（復習しやすい）
          if(sc > 0){
            if(m.has.video) sc += 0.4;
            if(m.has.slide) sc += 0.3;
            if(m.has.info)  sc += 0.2;
            out.push({ st:st, ar:ar, m:m, sc:sc });
          }
        });
      });
    });
    out.sort(function(a,b){ return b.sc - a.sc; });
    return out.slice(0, limit || 6);
  }

  function hitHtml(h){
    var url = 'stages/' + h.st.key + '/quest.html?id=' + h.m.id;
    var mats = '<span class="' + (h.m.has.video?'':'no') + '">🎬 動画</span>'
             + '<span class="' + (h.m.has.slide?'':'no') + '">📑 スライド</span>'
             + '<span class="' + (h.m.has.info?'':'no')  + '">📊 まとめ</span>';
    return '<a class="hit" href="' + url + '">'
      + '<div class="h1">' + esc(h.m.id) + '　' + esc(h.m.name) + '</div>'
      + '<div class="h2">' + esc(h.st.short) + '／' + esc(h.ar.title) + '（' + esc(h.ar.sub) + '）</div>'
      + (h.m.doing ? '<div class="h3">' + esc(h.m.doing) + '</div>' : '')
      + '<div class="mats">' + mats + '</div>'
      + '</a>';
  }

  function say(who, text, hits){
    var d = document.createElement('div');
    d.className = 'msg' + (who === 'me' ? ' me' : '');
    d.innerHTML = '<div class="ico">' + (who === 'me' ? '🧑' : '🧭') + '</div>'
      + '<div><div class="bub">' + esc(text) + '</div>'
      + (hits && hits.length ? '<div class="hits">' + hits.map(hitHtml).join('') + '</div>' : '')
      + '</div>';
    el('log').appendChild(d);
    d.scrollIntoView({ behavior:'smooth', block:'nearest' });
    return d;
  }

  /* ── AIに整理させる。使えなければ検索結果だけで成立させる ── */
  function ask(q){
    if(busy || !q.trim()) return;
    busy = true; el('send').disabled = true;
    say('me', q);
    var hits = search(q, 6);
    var thinking = say('bot', '探しています…');

    var ctx = hits.map(function(h){
      return '- ' + h.m.id + '「' + h.m.name + '」／' + h.st.short + '／' + h.ar.title
           + (h.m.doing ? '／やること：' + h.m.doing : '');
    }).join('\n');

    fetch(API + '?action=concierge&q=' + encodeURIComponent(q) + '&ctx=' + encodeURIComponent(ctx))
      .then(function(r){ return r.json(); })
      .then(function(j){
        thinking.remove();
        if(j && j.ok && j.answer) say('bot', j.answer, hits);
        else say('bot', fallbackText(q, hits), hits);
      })
      .catch(function(){
        thinking.remove();
        say('bot', fallbackText(q, hits), hits);
      })
      .then(function(){ busy = false; el('send').disabled = false; });
  }

  function fallbackText(q, hits){
    if(!hits.length){
      return '「' + q + '」に近いマスが見つかりませんでした。\n'
           + 'ことばを変えて（例：議事録／集計／資料づくり／画像）もう一度お願いします。';
    }
    return '近いのはこのあたりです。上から順におすすめです。';
  }

  /* ── 起動 ── */
  el('chips').innerHTML = EXAMPLES.map(function(x){
    return '<button data-q="' + esc(x) + '">' + esc(x) + '</button>'; }).join('');
  el('chips').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    el('q').value = b.getAttribute('data-q'); ask(b.getAttribute('data-q'));
  });
  el('send').onclick = function(){ ask(el('q').value); el('q').value = ''; };
  el('q').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ ask(el('q').value); el('q').value = ''; } });

  fetch('assets/catalog.json?v=1')
    .then(function(r){ return r.json(); })
    .then(function(j){
      CAT = j;
      var n = 0;
      j.stages.forEach(function(s){ s.areas.forEach(function(a){ n += a.masses.length; }); });
      el('note').textContent = j.stages.length + 'コース ' + n + 'マスから探します。';
      say('bot', 'こんにちは。何を身につけたいですか？\n「議事録を自動で作りたい」のように、やりたいことで聞いてください。');
    })
    .catch(function(){
      el('note').textContent = '索引が読み込めませんでした。時間をおいてお試しください。';
    });
})();
</script>
</body>
</html>
